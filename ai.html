<style>
    #piano {
        display: flex;
        height: 200px;
    }

    .octave {
        display: flex;
        flex: 1;
        position: relative;
    }

    .white {
        flex: 1;
        background: white;
        border: 1px solid #222;
    }

    .black {
        position: absolute;
        top: 0;
        right: -4%;
        width: 8%;
        height: 60%;
        background: black;
        z-index: 2;
    }

    .key:active {
        background: #aaa;
    }

    .black:active {
        background: #444;
    }
</style>

<div id="piano">
    <div class="octave">
        <div class="key white" data-note="C"></div>
        <div class="key white" data-note="D">
            <div class="key black" data-note="C#"></div>
        </div>
        <div class="key white" data-note="E">
            <div class="key black" data-note="D#"></div>
        </div>
        <div class="key white" data-note="F"></div>
        <div class="key white" data-note="G">
            <div class="key black" data-note="F#"></div>
        </div>
        <div class="key white" data-note="A">
            <div class="key black" data-note="G#"></div>
        </div>
        <div class="key white" data-note="B">
            <div class="key black" data-note="A#"></div>
        </div>
    </div>
</div>
